name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the playwright version in package.json. Checked by the first step of each job.
  PLAYWRIGHT_VERSION: 1.64.1

jobs:
  ci:
    name: Lint, check, build, test, size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Browsers and their system libraries come preinstalled, so no apt-get at run time.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the Playwright version matches the container
        run: test "$(pnpm --filter @sveltier/ui exec playwright --version)" = "Version $PLAYWRIGHT_VERSION"

      # Builds the package first (svelte-package + publint + attw), then the docs.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      # Vitest browser mode (Chromium, Firefox, WebKit) + SSR tests, then docs e2e tests.
      - name: Test
        run: pnpm test

      - name: Size budgets
        run: pnpm size

      # The tested build is the one that gets deployed.
      - name: Keep the docs build
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: apps/docs/build
          retention-days: 3

  deploy-docs:
    name: Deploy the docs
    needs: ci
    # main goes to production; branches of this repository get a preview. Pull requests from
    # forks have no access to the secrets, so they are skipped.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-build
          path: build

      - name: Skip without Cloudflare credentials
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the docs were not deployed."

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        # An explicit bash runs with pipefail, so a failed deploy is not hidden behind tee.
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npx --yes wrangler@4.149.0 pages deploy build --project-name=sveltier --branch="$BRANCH" | tee deploy.log
          url=$(grep -Eo 'https://[^ ]+\.pages\.dev' deploy.log | tail -n 1)
          echo "Docs deployed from \`$BRANCH\`: $url" >> "$GITHUB_STEP_SUMMARY"

  min-svelte:
    name: Package on the lowest supported Svelte
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      # Keep in sync with peerDependencies.svelte in packages/sveltier/package.json.
      SVELTE_MIN: 5.40.0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install with the lowest supported Svelte
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @sveltier/ui add -D "svelte@$SVELTE_MIN"

      - name: Check the Playwright version matches the container
        run: test "$(pnpm --filter @sveltier/ui exec playwright --version)" = "Version $PLAYWRIGHT_VERSION"

      - name: Build, check and test the package
        run: |
          pnpm --filter @sveltier/ui build
          pnpm --filter @sveltier/ui check
          pnpm --filter @sveltier/ui test
