name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, check, build, test, size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds the package first (svelte-package + publint + attw), then the docs.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter sveltier exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter sveltier exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter sveltier exec playwright install-deps chromium firefox webkit

      # Vitest browser mode (Chromium, Firefox, WebKit) + SSR tests, then docs e2e tests.
      - name: Test
        run: pnpm test

      - name: Size budgets
        run: pnpm size

  min-svelte:
    name: Package on the lowest supported Svelte
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep in sync with peerDependencies.svelte in packages/sveltier/package.json.
      SVELTE_MIN: 5.40.0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install with the lowest supported Svelte
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter sveltier add -D "svelte@$SVELTE_MIN"

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter sveltier exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter sveltier exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter sveltier exec playwright install-deps chromium firefox webkit

      - name: Build, check and test the package
        run: |
          pnpm --filter sveltier build
          pnpm --filter sveltier check
          pnpm --filter sveltier test
