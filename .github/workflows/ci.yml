name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the playwright version in package.json. Checked by the first step of each job.
  PLAYWRIGHT_VERSION: 1.64.1

jobs:
  ci:
    name: Lint, check, build, test, size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Browsers and their system libraries come preinstalled, so no apt-get at run time.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the Playwright version matches the container
        run: test "$(pnpm --filter sveltier exec playwright --version)" = "Version $PLAYWRIGHT_VERSION"

      # Builds the package first (svelte-package + publint + attw), then the docs.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      # Vitest browser mode (Chromium, Firefox, WebKit) + SSR tests, then docs e2e tests.
      - name: Test
        run: pnpm test

      - name: Size budgets
        run: pnpm size

  min-svelte:
    name: Package on the lowest supported Svelte
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      # Keep in sync with peerDependencies.svelte in packages/sveltier/package.json.
      SVELTE_MIN: 5.40.0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install with the lowest supported Svelte
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter sveltier add -D "svelte@$SVELTE_MIN"

      - name: Check the Playwright version matches the container
        run: test "$(pnpm --filter sveltier exec playwright --version)" = "Version $PLAYWRIGHT_VERSION"

      - name: Build, check and test the package
        run: |
          pnpm --filter sveltier build
          pnpm --filter sveltier check
          pnpm --filter sveltier test
