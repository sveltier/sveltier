name: Release

# Stages @sveltier/ui on npm through trusted publishing when the version in its package.json is
# not on npm yet. It runs after CI has passed on a push to main, so merging the pull request that
# bumps the version stages it: CI has already built and tested that commit, so this only builds
# the package again (publint and attw included) and stages it. GitHub's OIDC token stands in for
# an npm token, and npm signs provenance on its own. The staged version stays private until a
# maintainer approves it with 2FA, on npmjs.com (Staged Packages) or with
# `npm stage approve <stage-id>`. Run it by hand on main (Actions > Release > Run workflow) to
# stage a version that is on main already, for example after a failed run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dist-tag:
        description: The npm dist-tag the version gets once it is approved
        type: choice
        options: [latest, alpha, next]
        default: latest

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is the version new?
    # By hand, or after CI passed on a push to main; never for a pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Refuse to release from a branch other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow on main, not on $GITHUB_REF_NAME."
          exit 1

      # The commit CI has just passed, or main's head when run by hand.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: version
        working-directory: packages/sveltier
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if npm view "@sveltier/ui@$version" version > /dev/null 2>&1; then
            echo "@sveltier/ui@$version is already on npm: nothing to stage." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  stage:
    name: Build and stage
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing and provenance.
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # Alphas go to latest while there is no stable version; by hand, the input chooses.
      DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # The build runs publint and attw on the package as it will be published.
      - name: Build the package
        run: pnpm --filter @sveltier/ui build

      # Staged publishing needs npm 11.15.0 or later; Node 22 ships an older npm.
      - name: Stage on npm
        working-directory: packages/sveltier
        run: |
          npx --yes npm@11.21.0 stage publish --tag "$DIST_TAG" | tee "$RUNNER_TEMP/stage.log"
          id=$(sed -n 's/.*(staged with id \(.*\))$/\1/p' "$RUNNER_TEMP/stage.log")
          approve="npm stage approve ${id:-<stage-id>}"
          echo "::notice title=Approve @sveltier/ui@$VERSION on npm::Staged under $DIST_TAG. Approve it with 2FA on npmjs.com (Staged Packages), or run: $approve"
          {
            echo "Staged \`@sveltier/ui@$VERSION\` under the dist-tag \`$DIST_TAG\`."
            echo
            echo "Approve it with 2FA on npmjs.com (Staged Packages), or run \`$approve\`."
          } >> "$GITHUB_STEP_SUMMARY"
