name: Release

# Publishes @sveltier/ui on npm through trusted publishing when the version in its package.json
# is not on npm yet. It runs after CI has passed on a push to main, so merging the pull request
# that bumps the version publishes it: CI has already built and tested that commit, so this only
# builds the package again (publint and attw included) and publishes it. GitHub's OIDC token
# stands in for an npm token, and npm signs provenance on its own. Run it by hand on main
# (Actions > Release > Run workflow) to publish a version that is on main already, for example
# after a failed run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dist-tag:
        description: The npm dist-tag the version is published under
        type: choice
        options: [latest, next]
        default: latest

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is the version new?
    # By hand, or after CI passed on a push to main; never for a pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Refuse to release from a branch other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow on main, not on $GITHUB_REF_NAME."
          exit 1

      # The commit CI has just passed, or main's head when run by hand.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: version
        working-directory: packages/sveltier
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if npm view "@sveltier/ui@$version" version > /dev/null 2>&1; then
            echo "@sveltier/ui@$version is already on npm: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing and provenance.
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # A release goes to latest; by hand, the input chooses.
      DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # The build runs publint and attw on the package as it will be published.
      - name: Build the package
        run: pnpm --filter @sveltier/ui build

      # The docs build writes the docs for coding agents into the package (llms.txt,
      # llms-full.txt, components.json, docs/*.md), so the tarball describes its own version.
      - name: Build the agent docs
        run: |
          pnpm --filter @sveltier/docs build
          node packages/sveltier/scripts/check-agent-docs.js

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older npm.
      - name: Publish on npm
        working-directory: packages/sveltier
        run: |
          npx --yes npm@11.21.0 publish --access public --tag "$DIST_TAG"
          echo "::notice title=Published @sveltier/ui@$VERSION::Under the dist-tag $DIST_TAG, with provenance."
          echo "Published \`@sveltier/ui@$VERSION\` under the dist-tag \`$DIST_TAG\`, with provenance." >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Create the GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job of its own, so the job that runs the build and holds the npm identity cannot write to
    # the repository. If it fails, re-run this job: the version is on npm already.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ needs.check.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Create the tag and the release from the changelog
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $tag exists already." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { found = 0 } found' packages/sveltier/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$tag" --notes-file notes.md "${prerelease[@]}"
